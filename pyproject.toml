[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-architecture-context"
version = "0.1.7"
description = "Source-grounded live architecture context for coding agents"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
archctx = "archctx:main"
archctx-to-archify = "archctx_to_archify:main"
archctx-calm-query = "calm_query:main"
archctx-blueprint = "archctx_blueprint:main"
archctx-hook = "archctx_hook:main"
archctx-understand = "archctx_understand:main"

[tool.setuptools]
py-modules = ["archctx", "archctx_to_archify", "calm_query", "archctx_blueprint", "archctx_development", "archctx_hook", "archctx_understand", "archctx_runtime"]
