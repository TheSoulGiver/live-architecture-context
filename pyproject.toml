[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-architecture-context"
version = "0.1.0"
description = "Source-grounded live architecture context for coding agents"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
archctx = "archctx:main"

[tool.setuptools]
py-modules = ["archctx"]
