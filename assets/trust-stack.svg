<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 790" role="img" aria-labelledby="title desc">
  <title id="title">Live Architecture Context trust stack</title>
  <desc id="desc">Source code is the authority. CALM supplies code facts. Live Architecture Context supplies canonicality and freshness to coding agents. Archify validates and visualizes as a sidecar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#142440"/></linearGradient>
    <linearGradient id="lac" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#156157"/><stop offset="1" stop-color="#259b86"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4z" fill="#66e1c6"/></marker>
    <style>.k{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.1px;fill:#a8b8d1}.h{font:700 27px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}.l{font:700 19px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.s{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#d0d9e7}.m{font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.5px;fill:#aebbd1}</style>
  </defs>
  <rect width="640" height="790" rx="20" fill="url(#bg)"/>
  <text x="38" y="46" class="k">TRUST STACK</text><text x="38" y="84" class="h">Source is truth. LAC knows when its memory is stale.</text>
  <g transform="translate(38 120)"><rect width="564" height="98" rx="16" fill="#172640" stroke="#5b6f90"/><text x="24" y="37" class="l">SOURCE CODE</text><text x="24" y="64" class="s">Authority for every architecture claim.</text><text x="392" y="37" class="k">AUTHORITATIVE</text></g>
  <path d="M320 221v28" stroke="#66e1c6" stroke-width="2.5" marker-end="url(#a)"/>
  <g transform="translate(38 254)"><rect width="564" height="98" rx="16" fill="#102b3c" stroke="#4e89ad"/><text x="24" y="37" class="l">CALM</text><text x="24" y="64" class="s">Code facts: graph, callers, callees, index freshness.</text><text x="345" y="37" class="k">HOW CODE CONNECTS</text></g>
  <path d="M320 355v28" stroke="#66e1c6" stroke-width="2.5" marker-end="url(#a)"/>
  <g transform="translate(38 388)"><rect width="564" height="152" rx="16" fill="url(#lac)" stroke="#73ebd1" stroke-width="1.5"/><text x="24" y="37" class="l">LIVE ARCHITECTURE CONTEXT</text><text x="24" y="68" class="s">canonical implementation + truth source + exact evidence</text><text x="24" y="94" class="s">revision binding + FRESH / STALE + last-known-good</text><text x="24" y="128" class="k" fill="#d6fff5">WHAT THE AGENT SHOULD TRUST NOW</text></g>
  <path d="M320 543v28" stroke="#66e1c6" stroke-width="2.5" marker-end="url(#a)"/>
  <g transform="translate(38 576)"><rect width="564" height="78" rx="16" fill="#172640" stroke="#5b6f90"/><text x="24" y="32" class="l">CODEX / CLAUDE / AGENTS</text><text x="24" y="58" class="s">Compact typed context, then targeted source reads.</text></g>
  <g transform="translate(38 684)"><rect width="564" height="70" rx="16" fill="#111c30" stroke="#8d9db6" stroke-dasharray="6 6"/><text x="24" y="30" class="l">ARCHIFY</text><text x="24" y="54" class="s">Validation and human visualization sidecar, not source authority.</text></g>
</svg>
